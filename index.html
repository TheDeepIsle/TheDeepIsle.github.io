<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Server Name | The Isle Evrima</title>
    <style>
        /* Simple, dark gaming theme */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #12141c;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: #1a1d29;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #2d3142;
        }
        h1 {
            color: #4ade80; /* Evrima green accent */
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: block;
            padding: 15px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-discord {
            background-color: #5865F2; /* Discord Blue */
            color: white;
        }
        .btn-discord:hover {
            background-color: #4752C4;
        }
        .btn-mumble {
            background-color: #4ade80; /* Mumble / Action Green */
            color: #12141c;
        }
        .btn-mumble:hover {
            background-color: #22c55e;
        }
        .note {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Change this to your server's name -->
        <h1>YOUR SERVER NAME</h1>
        <p>Welcome to our The Isle Evrima community. Join our Discord to check server rules, read our lore, meet the community, and get whitelisted!</p>
        
        <div class="btn-container">
            <!-- Replace with your actual Discord Invite Link -->
            <a href="https://discord.gg" target="_blank" class="btn btn-discord">Join Our Discord</a>
            
            <!-- This link is ready. It will work the second you upload 'mumble_plugin.zip' later -->
            <a href="mumble_plugin.zip" download class="btn btn-mumble">Download Required Mumble Plugin</a>
            <span class="note">(Installation instructions are pinned in our Discord)</span>
        </div>
    </div>

</body>
</html>
